name: Build FlowerPower Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: "1.0.2"
  OUTPUT_NAME: "SF_FlowerPower1.0.2.jar"

jobs:
  compatibility:
    name: ${{ matrix.slimefun }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slimefun: [legacy, united]

    steps:
      - name: Checkout FlowerPower
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Checkout Slimefun Legacy
        if: matrix.slimefun == 'legacy'
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: .deps/Slimefun-Legacy

      - name: Publish Slimefun Legacy API locally
        if: matrix.slimefun == 'legacy'
        working-directory: .deps/Slimefun-Legacy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew publishToMavenLocal -PprojectVersion=FLOWERPOWER-LEGACY-SNAPSHOT --no-daemon --refresh-dependencies; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Slimefun Legacy dependency build failed after 3 attempts." >&2
              exit 1
            fi
            echo "Transient dependency failure on attempt ${attempt}/3; retrying..."
            sleep $((attempt * 15))
          done

      - name: Checkout Slimefun United
        if: matrix.slimefun == 'united'
        uses: actions/checkout@v6
        with:
          repository: Slimefun-United/Slimefun-United
          ref: dev
          path: .deps/Slimefun-United

      - name: Set up Java 21 for Slimefun United source build
        if: matrix.slimefun == 'united'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Publish Slimefun United API locally
        if: matrix.slimefun == 'united'
        working-directory: .deps/Slimefun-United
        run: mvn -B -DskipTests install

      - name: Restore Java 25 for FlowerPower validation
        if: matrix.slimefun == 'united'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve Slimefun coordinate
        id: sf
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.slimefun }}" == "legacy" ]]; then
            echo 'group=com.github.slimefun' >> "$GITHUB_OUTPUT"
            echo 'artifact=Slimefun' >> "$GITHUB_OUTPUT"
            echo 'version=FLOWERPOWER-LEGACY-SNAPSHOT' >> "$GITHUB_OUTPUT"
          else
            VERSION="$(mvn -q -f .deps/Slimefun-United/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
            echo 'group=io.github.slimefun_united' >> "$GITHUB_OUTPUT"
            echo 'artifact=slimefun-united' >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Paper 1.21.11 release floor
        if: matrix.slimefun == 'legacy'
        run: >-
          mvn -B clean verify
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Verify Paper 26.1.x
        run: >-
          mvn -B clean verify
          '-Dpaper.version=[26.1.build,26.2.build)'
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Verify Paper 26.2 primary
        run: >-
          mvn -B clean verify
          -Dpaper.version=26.2.build.112-stable
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Verify Paper 26.3 alpha
        run: >-
          mvn -B clean verify
          -Dpaper.version=26.3-rc-3.build.1-alpha
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Rebuild universal release JAR from Paper 1.21.11
        if: matrix.slimefun == 'legacy'
        run: >-
          mvn -B clean package
          -Dpaper.version=1.21.11-R0.1-SNAPSHOT
          -Dslimefun.groupId=${{ steps.sf.outputs.group }}
          -Dslimefun.artifactId=${{ steps.sf.outputs.artifact }}
          -Dslimefun.version=${{ steps.sf.outputs.version }}

      - name: Stage raw release JAR
        if: matrix.slimefun == 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s "target/${OUTPUT_NAME}"
          cp "target/${OUTPUT_NAME}" "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'plugin.yml'
          unzip -p "dist/${OUTPUT_NAME}" plugin.yml | grep -Fq "version: ${RELEASE_VERSION}"
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload raw JAR artifact
        if: matrix.slimefun == 'legacy'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish 1.0.2 raw JAR
    needs: compatibility
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release target
        uses: actions/checkout@v6

      - name: Download validated raw JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist

      - name: Verify release JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/${OUTPUT_NAME}"
          jar tf "dist/${OUTPUT_NAME}" | grep -Fxq 'plugin.yml'
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Publish raw GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          JAR="dist/${OUTPUT_NAME}"
          NOTES="FlowerPower 1.0.2 adds Paper 26.3 alpha compatibility validation while retaining Minecraft/Paper 1.21.11, Paper 26.1.x and 26.2 support plus Slimefun Legacy and Slimefun United validation."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "SF_FlowerPower ${RELEASE_VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_FlowerPower ${RELEASE_VERSION}" --notes "$NOTES"
          fi
